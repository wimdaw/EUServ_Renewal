name: Euserv VPS Renewal
on:
  schedule:
    # 每日巡检：脚本自动判断是否到续约日期，未到期时秒退。
    # 固定 cron + 服务端日期判断，替代旧的「改文件动态 cron」设计——
    # 后者需要能改 .github/workflows/ 的 PAT（github.token 无 workflows 权限），
    # PAT 一过期整条链路就断（2026-09-25 即因此漏续）。
    - cron: 30 2 * * *
  workflow_dispatch:
# contents:write 仅供 checkout 持久化凭据使用；无任何回写文件的步骤。
permissions:
  contents: read
jobs:
  renew-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache Virtual Environment
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: venv
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt') }}
      - name: Create venv and Install dependencies
        run: |
          if [ ! -d venv/bin ]; then
            python -m venv venv
          fi
          source venv/bin/activate
          python -m pip install --upgrade pip
          if ! python -c "import requests, bs4" 2>/dev/null; then
            pip install -r requirements.txt
          fi
      - name: Run renewal script with retry
        id: renewal
        env:
          EUSERV_USERNAME: ${{ secrets.EUSERV_USERNAME }}
          EUSERV_PASSWORD: ${{ secrets.EUSERV_PASSWORD }}
          EUSERV_2FA: ${{ secrets.EUSERV_2FA }}
          CAPTCHA_USERID: ${{ secrets.CAPTCHA_USERID }}
          CAPTCHA_APIKEY: ${{ secrets.CAPTCHA_APIKEY }}
          CLOUD_MAIL_API_URL: ${{ secrets.CLOUD_MAIL_API_URL }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          TG_API_HOST: ${{ secrets.TG_API_HOST }}
        run: |
          source venv/bin/activate

          MAX_RETRIES=3
          RETRY_DELAY=60  # 60秒快速重试，避免失败后长时间挂起

          for i in $(seq 1 $MAX_RETRIES); do
            echo "========================================="
            echo "🔄 尝试 $i/$MAX_RETRIES - $(date)"
            echo "========================================="
            
            set +e  # 允许非零退出码
            python Euserv_Renewal.py
            EXIT_CODE=$?
            set -e
            
            # 退出码处理
            case $EXIT_CODE in
              0)
                echo "✅ 续约成功或无需续约"
                exit 0
                ;;
              2)
                echo "⏭️ 未到续约日期，跳过执行 (每日巡检将再次尝试)"
                # 正常退出，让后续步骤执行动态调度更新
                exit 0
                ;;
              *)
                echo "❌ 续约失败 (退出码: $EXIT_CODE)"
                if [ $i -lt $MAX_RETRIES ]; then
                  echo "⏳ 等待 60 秒后重试..."
                  sleep $RETRY_DELAY
                fi
                ;;
            esac
          done

          echo "💥 所有 $MAX_RETRIES 次重试均失败"
          exit 1
      - name: Upload failed captcha for debugging
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: captcha-failed
          path: captcha_failed.png
          if-no-files-found: ignore
          retention-days: 7
