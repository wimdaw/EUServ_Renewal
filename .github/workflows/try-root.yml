name: Euserv Try Root SSH
on:
  workflow_dispatch:
    inputs:
      passwords:
        description: '额外候选密码(逗号分隔, 面板密码自动加入)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  tryroot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Bridge via node2 (IPv6) and reinstall
        env:
          EUSERV_PASSWORD: ${{ secrets.EUSERV_PASSWORD }}
          NODE2_PASSWORD: ${{ secrets.NODE2_SSH_PASSWORD }}
          EXTRA_PASSWORDS: ${{ github.event.inputs.passwords }}
        run: |
          sudo apt-get install -y sshpass >/dev/null 2>&1 || true
          sshpass -p "$NODE2_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@107.148.41.107 "EUSERV_PASSWORD='$EUSERV_PASSWORD' EXTRA_PASSWORDS='$EXTRA_PASSWORDS' bash -s" < scripts/bridge.sh
